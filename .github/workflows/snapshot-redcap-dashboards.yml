name: Snapshot REDCap dashboards

on:
  schedule:
    - cron: "17 7 * * *"   # daily, 07:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot-redcap-dashboards
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: nascarr
            url: "https://redcap.ucdenver.edu/surveys/?__dashboard=YHT3DR8JYX4"
            dir: rc-dash-nascarr-latest
    steps:
      - uses: actions/checkout@v4

      - name: Capture dashboard
        id: snap
        run: |
          set +e
          python3 scripts/snapshot_redcap_dashboard.py "${{ matrix.url }}" "${{ matrix.dir }}"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then echo "changed=true" >> "$GITHUB_OUTPUT";
          elif [ "$rc" -eq 3 ]; then echo "changed=false" >> "$GITHUB_OUTPUT";
          else exit "$rc"; fi

      - name: Commit and push
        if: steps.snap.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898231+github-actions[bot]@users.noreply.github.com"
          git add -A "${{ matrix.dir }}"
          git commit -m "Update ${{ matrix.dir }} snapshot ($(date -u +%Y-%m-%d))"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
